services:
  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr:latest
    env_file:
      - .env
    ports:
      - ${WIZARR_PORT}:5690
    volumes:
      - ${CONFIG_DIRECTORY}/wizarr/database:/data/database
    environment:
      - TZ=America/Chicago
      - APP_URL=${APP_URL}
    restart: unless-stopped