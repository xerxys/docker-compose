services:
  joplin-app: #https://joplinapp.org/
    container_name: joplin-app    
    image: joplin/server:latest #https://github.com/laurent22/joplin
    env_file:
      - .env 
    ports:
      - ${APP_PORT}:22300 #http://192.168.86.240:3097/login
    environment:
      - APP_PORT=${APP_PORT}
      - APP_BASE_URL=${APP_BASE_URL}
      - DB_CLIENT=pg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=joplin-db    
      - MAILER_ENABLED=0
    depends_on:
      - joplin-db
    restart: unless-stopped

  joplin-db:
    container_name: joplin-db
    image: postgres:13
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - /home/xerxys/mediaserver/plex/data/joplin:/var/lib/postgresql/data      
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    restart: unless-stopped  