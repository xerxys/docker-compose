services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - 9696:9696  
    volumes:
      - /home/xerxys/mediaserver/config/Prowlarr:/config
      - /home/xerxys/mediaserver/downloads:/downloads        
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    ports:
      - 9117:9117  
    volumes:
      - /home/xerxys/mediaserver/config/Jackett:/config
      - /home/xerxys/mediaserver/downloads:/downloads        
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - AUTO_UPDATE=true #optional
#      - RUN_OPTS= #optional
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - 8191:8191  
    volumes:
      - /home/xerxys/mediaserver/config/Flaresolverr:/config        
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info} 
      - LOG_HTML=${LOG_HTML:-false} 
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=America/Chicago
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - 6767:6767    
    volumes:
      - /home/xerxys/mediaserver/config/bazarr:/config
      - /home/xerxys/mediaserver/plex/data/movies:/movies #optional
      - /home/xerxys/mediaserver/plex/data/tv:/tv #optional
      - /home/xerxys/mediaserver/plex/data/anime:/anime
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    restart: unless-stopped
  
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    ports:
      - 7878:7878   
    volumes:
      - /home/xerxys/mediaserver/config/Radarr:/config
      - /home/xerxys/mediaserver/downloads:/downloads
      - /home/xerxys/mediaserver/plex/data/movies:/movies       
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - UMASK_SET=022 #optional
    restart: unless-stopped
  
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    ports:
      - 8989:8989    
    volumes:
      - /home/xerxys/mediaserver/config/Sonarr:/config
      - /home/xerxys/mediaserver/downloads:/Downloads
      - /home/xerxys/mediaserver/plex/data/tv:/tv
      - /home/xerxys/mediaserver/plex/data/anime:/anime      
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - UMASK_SET=022
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    ports:
      - 8686:8686    
    volumes:
      - /home/xerxys/mediaserver/config/lidarr:/config
      - /home/xerxys/mediaserver/plex/data/music:/music #optional
      - /home/xerxys/mediaserver/downloads:/downloads #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    restart: unless-stopped