services:
  nginx:
    container_name: nginx    
    image: 'jc21/nginx-proxy-manager:latest'
    ports:
      # These ports are in format <host-port>:<container-port>
      - ${NPM_HTTP_PORT}:80 # Public HTTP Port
      - ${NPM_HTTPS_PORT}:443 # Public HTTPS Port
      - ${NPM_ADMIN_PORT}:81 # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP
    volumes:
      - ${CONFIG_DIRECTORY}/nginx-proxy-manager:/data
      - ${CONFIG_DIRECTORY}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt    
    environment:
      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: 'true'
    restart: unless-stopped